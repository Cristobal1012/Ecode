services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ecode_qa_scrum149
      POSTGRES_USER: qa149
      POSTGRES_PASSWORD: qa149-local-only
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["postgres149:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa149 -d ecode_qa_scrum149"]
      interval: 2s
      timeout: 2s
      retries: 30
  mongo:
    image: mongo:6
    ports: ["127.0.0.1:27049:27017"]
    volumes: ["mongo149:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres149:
  mongo149:
